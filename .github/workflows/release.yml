name: Release

# Runs whenever CI passes on master. The next version comes from the
# Conventional Commits since the last tag (feat: minor, fix:/perf: patch,
# `!`/BREAKING CHANGE: major), see .github/scripts/next-version.sh. When
# there is something to release, the workflow bumps Cargo.toml, tags the
# commit as v<version>, builds every target, attaches the archives and
# executables to a GitHub release and updates the download section of
# README.md. A version bumped by hand in Cargo.toml is released as is.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: tag version
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: Pick the version, bump it and tag it
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          current=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          next=$(bash .github/scripts/next-version.sh)

          if [[ -z "$next" ]]; then
            # no feat/fix since the last tag: just make sure it is released
            tag="v$current"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "Nothing to release: no feat/fix commits since $tag."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            tag="v$next"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            if [[ "$next" != "$current" ]]; then
              bash .github/scripts/set-version.sh "$next"
              git commit -m "release: $next [skip ci]" -- Cargo.toml Cargo.lock
              if ! git push origin HEAD:master; then
                echo "master moved on since $SHA: the CI run of the newer commit will release it."
                echo "release=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Bumped the version from $current to $next."
            fi
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists, building its release."
          else
            git tag -a "$tag" -m "fishies $tag" HEAD
            git push origin "$tag"
            echo "Created tag $tag on $(git rev-parse HEAD)."
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: tag
    if: needs.tag.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        # `targets` is a space-separated list built on the same runner
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, targets: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-22.04-arm, targets: aarch64-unknown-linux-gnu }
          - { name: linux-riscv64, os: ubuntu-22.04, targets: riscv64gc-unknown-linux-gnu }
          - { name: windows, os: windows-latest, targets: x86_64-pc-windows-msvc aarch64-pc-windows-msvc }
          # macOS runners are scarce: build both architectures on one
          - { name: macos, os: macos-latest, targets: aarch64-apple-darwin x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      TARGETS: ${{ matrix.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal $(printf -- '--target %s ' $TARGETS)
          rustup default stable
      - name: Install RISC-V linker
        if: contains(matrix.targets, 'riscv64')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu
          echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: |
          for target in $TARGETS; do
            cargo build --release --locked --target "$target"
          done
      - name: Package
        shell: bash
        run: |
          # Each target gets an archive (binary + README + LICENSE) and the
          # bare executable, downloadable without unpacking.
          mkdir -p dist
          for target in $TARGETS; do
            name="fishies-$TAG-$target"
            if [[ "$target" == *windows* ]]; then exe=".exe"; else exe=""; fi
            stage="staging/$name"
            mkdir -p "$stage"
            cp README.md LICENSE "target/$target/release/fishies$exe" "$stage/"
            if [[ -n "$exe" ]]; then
              (cd staging && 7z a -tzip "../dist/$name.zip" "$name" > /dev/null)
            else
              tar -C staging -czf "dist/$name.tar.gz" "$name"
            fi
            cp "target/$target/release/fishies$exe" "dist/$name$exe"
          done
          rm -r staging
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create GitHub release
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "fishies $TAG" \
            --generate-notes
      - uses: actions/checkout@v4
        with:
          ref: master
          path: repo
      - name: Update the README download section
        working-directory: repo
        run: |
          bash .github/scripts/update-readme.sh "$TAG" "$GITHUB_REPOSITORY"
          if git diff --quiet -- README.md; then
            echo "README already up to date for $TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update README downloads for $TAG [skip ci]" -- README.md
          # master may have moved while the release was building
          git pull --rebase origin master
          git push origin HEAD:master
