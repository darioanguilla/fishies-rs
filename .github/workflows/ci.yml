name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x86_64, os: windows-latest }
          # also cross-builds macOS x86_64, so CI needs a single macOS runner
          - { name: macos-arm64, os: macos-latest, extra_target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal ${{ matrix.extra_target && format('--target {0}', matrix.extra_target) || '' }}
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        shell: bash
        run: cargo test --locked 2>&1 | tee test-output.txt
      - name: Test summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Tests on ${{ matrix.name }}"
            echo
            grep -E '^test result:' test-output.txt | sed 's/^/- /' || echo "- no test results"
            echo
            echo "<details><summary>Test list</summary>"
            echo
            echo '```'
            grep -E '^test .* \.\.\. ' test-output.txt || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build ${{ matrix.extra_target }}
        if: matrix.extra_target
        shell: bash
        run: cargo build --locked --target ${{ matrix.extra_target }}

  # Release targets that the test matrix does not build.
  cross-build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: riscv64gc-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Install RISC-V linker
        if: matrix.target == 'riscv64gc-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu
          echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --target ${{ matrix.target }}
        shell: bash
