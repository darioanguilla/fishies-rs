[package]
name = "fishies"
version = "0.3.1"
edition = "2024"
description = "An aquarium animation in ASCII art, a Rust port of the Perl Asciiquarium variant 'fishies'"
license = "GPL-2.0-or-later"
repository = "https://github.com/darioanguilla/fishies-rs"
readme = "README.md"
keywords = ["ascii", "aquarium", "terminal", "animation"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29"
rand = "0.8"
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
