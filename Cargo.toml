[package]
name = "fishies"
version = "0.1.1"
edition = "2024"
description = "An aquarium animation in ASCII art, a Rust port of the Perl Asciiquarium variant 'fishies'"
license = "GPL-2.0-or-later"
repository = "https://github.com/darioanguilla/fishies-rs"
readme = "README.md"
keywords = ["ascii", "aquarium", "terminal", "animation"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29"
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
